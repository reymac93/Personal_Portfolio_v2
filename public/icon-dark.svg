<!-- DARK-mode tab icon. Matches the in-page logo in dark mode: dark tile,
     light monogram. The white "RM" glyph carries contrast against the browser
     tab strip. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#272727"/>
      <stop offset="1" stop-color="#1a1a1a"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#tile)"/>
  <rect x="0.9" y="0.9" width="62.2" height="62.2" rx="13.1" fill="none"
    stroke="#5da9ff" stroke-opacity="0.3" stroke-width="1.8"/>
  <text x="32" y="43" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif"
    font-size="30" font-weight="700" letter-spacing="-1" fill="#ffffff">RM</text>
  <circle cx="50" cy="15" r="4" fill="#5da9ff"/>
</svg>
